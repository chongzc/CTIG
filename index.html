  <!-- Game Container -->
  <section id="game-container" class="game-section">
    <div class="game-header">
      <h2 id="game-title">Game</h2>
      <button class="close-game" onclick="closeGame()">×</button>
    </div>
    <div id="game-content">
      <!-- Game content will be loaded here -->
    </div>
  </section>

  <!-- Game Progress Modal -->
  <div id="game-progress-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">Game Progress</h3>
      <p id="modal-message">You need to complete the game to continue!</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="comic.js"></script>
</body>
<script>
// Listen for postMessage from cover.html to start comic
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'startComic') {
    document.getElementById('cover-overlay').style.display = 'none';
    // Optionally, show page 1 if not already
    if (typeof showPage === 'function') showPage(1);
  }
});
</script>
</body>
